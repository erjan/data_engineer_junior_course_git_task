x-airflow-common:
  &airflow-common
  image: custom_airflow_pyspark:latest
  build:
    context: . 
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__FERNET_KEY: "RiGEYD7ykC2GadQDt0m9Ep3neyL51uTJu15ohrddXD8="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session"
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    # ClickHouse connection
    CH_HOST: clickhouse
    CH_PORT: 8123
    CH_USER: airflow
    CH_PASSWORD: airflow
    CH_DATABASE: sales_db
    # PostgreSQL connection
    PG_HOST: postgres
    PG_PORT: 5432
    PG_DB: airflow
    PG_USER: airflow
    PG_PASSWORD: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - postgres
    - clickhouse

services:
  postgres:
    image: postgres:13
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always
    networks:
      - airflow    

  clickhouse:
    image: clickhouse/clickhouse-server:22.8-alpine
    container_name: clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse", "client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    environment:
      CLICKHOUSE_USER: airflow
      CLICKHOUSE_PASSWORD: airflow
      CLICKHOUSE_DB: sales_db
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    restart: always
    networks:
      - airflow

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash    
    command: >    
      -c "airflow db init && airflow db migrate &&
          airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin &&
          echo '✅ Airflow initialized successfully.'"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: false
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data        
    restart: "no"
    networks:
      - airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    networks:
      - airflow        



  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    networks:
      - airflow      

volumes:
  clickhouse_data:
    driver: local
  postgres-db:
    driver: local

networks:
  airflow:
    driver: bridge
